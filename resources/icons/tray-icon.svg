<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="lens" cx="26" cy="25" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#dbeafe"/>
      <stop offset="30%"  stop-color="#93c5fd"/>
      <stop offset="70%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Outer housing -->
  <circle cx="32" cy="32" r="23" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>

  <!-- Lens body -->
  <circle cx="32" cy="32" r="20" fill="url(#lens)"/>

  <!-- Mid ring -->
  <circle cx="32" cy="32" r="15" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>

  <!-- Iris -->
  <circle cx="32" cy="32" r="11" fill="#1d4ed8"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="7.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>

  <!-- Pupil -->
  <circle cx="32" cy="32" r="5" fill="#0f172a"/>

  <!-- Glare -->
  <ellipse cx="27" cy="26" rx="4.5" ry="2.5" fill="rgba(255,255,255,0.55)" transform="rotate(-30 27 26)"/>

  <!-- REC dot -->
  <circle cx="53" cy="11" r="5.5" fill="#ef4444"/>
  <circle cx="53" cy="11" r="2.5" fill="#fca5a5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <!-- Dark background -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#111118"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#be123c" stroke-width="2"/>

  <!-- Lens housing -->
  <circle cx="32" cy="32" r="19" fill="#0f0f1a"/>

  <!-- Iris -->
  <circle cx="32" cy="32" r="12" fill="#be123c"/>

  <!-- Pupil -->
  <circle cx="32" cy="32" r="5" fill="#000"/>

  <!-- Glare -->

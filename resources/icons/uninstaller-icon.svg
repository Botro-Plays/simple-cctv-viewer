<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="lens" cx="205" cy="200" r="162" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#dbeafe"/>
      <stop offset="28%"  stop-color="#93c5fd"/>
      <stop offset="65%"  stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Outer camera housing -->
  <circle cx="256" cy="256" r="190" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.28)" stroke-width="10"/>

  <!-- Lens body (glass) -->
  <circle cx="256" cy="256" r="166" fill="url(#lens)"/>

  <!-- Mid focus ring -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="7"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="100" fill="url(#iris)"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="68"  fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="4"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="45"  fill="#0f172a"/>

  <!-- Glare -->
  <ellipse cx="214" cy="208" rx="38" ry="21" fill="rgba(255,255,255,0.54)" transform="rotate(-30 214 208)"/>
  <circle cx="272" cy="274" r="9" fill="rgba(255,255,255,0.20)"/>

  <!-- REC indicator -->
  <circle cx="406" cy="106" r="32" fill="#ef4444"/>
  <circle cx="406" cy="106" r="15" fill="#fca5a5"/>

  <!-- Uninstall badge (red, bottom-right) -->
  <circle cx="400" cy="400" r="74" fill="#dc2626" stroke="#b91c1c" stroke-width="5"/>
  <line x1="372" y1="372" x2="428" y2="428" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <line x1="428" y1="372" x2="372" y2="428" stroke="white" stroke-width="16" stroke-linecap="round"/>
</svg>
